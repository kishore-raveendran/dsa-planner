<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Concept lessons, daily practice and spaced reviews for NeetCode 150."><title>DSA Practice Planner</title>
<link rel="stylesheet" href="./styles.css"></head><body>
<header><div class="chrome"><div class="brand"><b>{ }</b>DSA Practice Planner</div><nav aria-label="Planner"><button data-view="today">Today</button><button data-view="calendar">Calendar</button><button data-view="roadmap">Roadmap</button><button data-view="progress">Progress</button><button data-view="reminder">Reminder</button></nav></div></header>
<details id="cloud" class="panel">
  <summary>Cloud sync</summary>
  <p id="cloud-status" class="muted" role="status">Signed out. Progress is saved on this browser.</p>
  <form>
    <div class="row">
    <label>Email <input name="email" type="email" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
    </div>
  </form>
  <p id="cloud-account"></p>
  <button id="cloud-sync" type="button" hidden>Sync now</button>
  <button id="cloud-import" type="button" hidden disabled>Import progress from this browser</button>
  <button id="cloud-sign-out" type="button" hidden>Sign out</button>
</details>
<main id="app"></main><dialog id="problem" aria-labelledby="problem-title"></dialog><p id="storage-error" role="alert" class="error"></p>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3"></script>
<script defer src="./catalog.js"></script>
<script defer src="./app.js"></script>
<script defer src="./cloud.js"></script></body></html>
